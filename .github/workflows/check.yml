# Compiles the Rust shell on the platforms this project cannot compile locally.
#
# The desktop app is developed on Windows, so macOS and Linux code paths are
# only ever exercised by CI. Before this existed the first time anyone found
# out a #[cfg(target_os = "macos")] block did not build was when a release tag
# had already gone out, which is far too late and far too slow a loop.
#
# This deliberately does not build installers, sign anything, or touch a
# release. It answers one question: does it compile.

name: Check

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: check-${{ matrix.platform }}

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # tauri-build reads tauri.conf.json at compile time and expects both the
      # frontend and the icons to exist. Neither is committed: dist is a copy of
      # index.html and the icons are generated from raw pixels. So cargo check
      # cannot run until these have.
      - name: Stage the frontend and icons
        working-directory: desktop
        run: |
          node build.mjs
          node make-icon.mjs

      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets
